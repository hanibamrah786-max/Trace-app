<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Tracer Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #camera-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        .container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none; }
        #trace-image { max-width: 100%; max-height: 100%; opacity: 0.5; transition: transform 0.1s; }

        .controls {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 3; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 8px; width: 85%; color: white; font-size: 12px;
            pointer-events: auto;
        }
        .btn-row { display: flex; gap: 5px; }
        button { flex: 1; padding: 8px; border-radius: 8px; border: none; background: #444; color: white; font-weight: bold; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <video id="camera-view" autoplay playsinline></video>
    <div class="container"><img id="trace-image" src="" style="display: none;"></div>

    <div class="controls">
        <div class="btn-row">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button onclick="document.getElementById('file-input').click()">📁 Upload</button>
            <button onclick="toggleCamera()">🔄 Flip</button>
            <button onclick="resetImage()">Reset</button>
        </div>
        <div>Opacity: <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5"></div>
        <div>Zoom: <input type="range" id="zoom-slider" min="0.1" max="3" step="0.01" value="1"></div>
        <div>Rotate: <input type="range" id="rotate-slider" min="0" max="360" step="1" value="0"></div>
    </div>

    <script>
        const video = document.getElementById('camera-view');
        const img = document.getElementById('trace-image');
        const opc = document.getElementById('opacity-slider');
        const zoom = document.getElementById('zoom-slider');
        const rot = document.getElementById('rotate-slider');
        const fileInput = document.getElementById('file-input');
        let currentFacingMode = 'environment';

        async function startCamera(mode) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
            video.srcObject = stream;
        }

        function toggleCamera() { currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user'; startCamera(currentFacingMode); }

        function updateTransform() { img.style.transform = `scale(${zoom.value}) rotate(${rot.value}deg)`; }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) { img.src = URL.createObjectURL(file); img.style.display = 'block'; }
        };

        opc.oninput = () => img.style.opacity = opc.value;
        zoom.oninput = updateTransform;
        rot.oninput = updateTransform;
        function resetImage() { zoom.value = 1; rot.value = 0; updateTransform(); }

        startCamera(currentFacingMode);
    </script>
</body>
</html>
